name: android
# Assembles the debug APK (phase 1: SDLActivity + OpenGL ES 3 / Dear ImGui skeleton,
# linking gridline_core) on changes that touch the engine, the build system or the
# Android project itself.
on:
  push:
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'packaging/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android NDK and CMake
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        working-directory: packaging/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gridline-android-debug
          path: packaging/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
