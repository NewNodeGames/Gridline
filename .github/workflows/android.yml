name: android
# Assembles the debug APK (phase 1: SDLActivity + OpenGL ES 3 / Dear ImGui skeleton,
# linking gridline_core) on pushes that touch the engine, the build system or the
# Android project itself. The SDK is installed from scratch each run (pinned
# cmdline-tools) so the workflow does not depend on any preinstalled runner image.
on:
  push:
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'packaging/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK (cmdline-tools, NDK, CMake, platform 35)
        run: |
          set -e
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          python3 -m zipfile -e "$RUNNER_TEMP/cmdline-tools.zip" "$SDK_ROOT/cmdline-tools/"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/"*   # python3 -m zipfile drops exec bits
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk.dir=$SDK_ROOT" > packaging/android/local.properties
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        working-directory: packaging/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gridline-android-debug
          path: packaging/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
